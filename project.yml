name: LGRemote
options:
  bundleIdPrefix: com.jinyoung
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: ko
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  LGRemote:
    type: application
    platform: iOS
    sources:
      - LGRemote
      - path: docs/privacy.md
        buildPhase: resources
    dependencies:
      - target: LGRemoteWidget
        embed: true
      - target: LGRemoteWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jinyoung.lgremote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: LGRemote/LGRemote.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jinyoung.lgremote
    info:
      path: LGRemote/Info.plist
      properties:
        CFBundleDisplayName: TV 리모컨
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: 같은 Wi-Fi에 있는 LG TV를 찾고 제어하기 위해 로컬 네트워크에 접근합니다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  LGRemoteWatch:
    type: application
    platform: watchOS
    sources:
      - LGRemoteWatch
      - LGRemote/Shared/TVCommand.swift
      - LGRemote/Shared/Localizable.xcstrings
      - LGRemote/Shared/InfoPlist.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jinyoung.lgremote.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    info:
      path: LGRemoteWatch/Info.plist
      properties:
        CFBundleDisplayName: TV 리모컨
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jinyoung.lgremote

  LGRemoteWidget:
    type: app-extension
    platform: iOS
    sources:
      - LGRemoteWidget
      - LGRemote/WebOS
      - LGRemote/Shared
      - path: LGRemote/Resources/RegistrationPayload.json
        buildPhase: resources
      - path: LGRemote/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jinyoung.lgremote.widget
        SKIP_INSTALL: YES
    entitlements:
      path: LGRemoteWidget/LGRemoteWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jinyoung.lgremote
    info:
      path: LGRemoteWidget/Info.plist
      properties:
        CFBundleDisplayName: TV 리모컨
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSLocalNetworkUsageDescription: 홈 화면 위젯에서 같은 Wi-Fi에 있는 LG TV를 제어하기 위해 로컬 네트워크에 접근합니다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
